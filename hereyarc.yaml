name: dilaya/aws-sqlite-data
version: 0.1.26
description: "Durable SQLite storage for Dilaya: S3-replicated (Litestream) per-app SQLite files served by an HTTP Data API on a self-healing EC2 Spot singleton, fronted by an IAM-authorized API Gateway."
visibility: private
iac: cdk
infra: aws
parameters:
  capabilityEnforce:
    description: "When 'true', the Data API REQUIRES a valid x-dilaya-capability token on every data route (missing or invalid -> 403 CAPABILITY_DENIED). 'false' (default) = warn mode: the token is validated when present but a request without one is allowed (logging cap_missing). Flip to 'true' once every caller (connector + per-app Lambdas) mints tokens."
    mandatory: false
    default: "false"
  telegramBotTokenParam:
    description: "Nom du paramètre SSM portant le jeton du bot Telegram qui relaie les alarmes (heartbeat mort / ASG à zéro instance) — jamais le jeton lui-même. Peut pointer sur la fiche de credentials du connecteur ({\"bot_token\":…,\"secret_token\":…}) : le relais en extrait bot_token. Vide (défaut) -> aucune Lambda de relais n'est créée et le topic d'alarme reste sans abonné. DOIT être fourni avec telegramChatId."
    mandatory: false
    default: ""
  telegramChatId:
    description: "Chat id Telegram prévenu quand une alarme bascule (et quand elle se rétablit). DOIT être fourni avec telegramBotTokenParam — les deux conditionnent la création du relais."
    mandatory: false
    default: ""
  litestreamL0RetentionCheckInterval:
    description: "Cadence du balayage de rétention L0 (défaut '30m' ; litestream livre '15s'). Litestream lance ce balayage comme un minuteur FIXE par base, qu'elle ait été écrite ou non, et chaque tic LISTe la réplique S3 : c'est le premier poste de la facture de requêtes S3 (mesure du 24/08 : 16,5 M de ListBucket = 82,60 $ sur 24 jours, contre 0,25 $ de PutObject). NE TOUCHE PAS à la fenêtre de perte, qui est portée par litestreamSyncIntervalMs seul — ralentir ce balayage ne coûte qu'une restauration un peu plus lente."
    mandatory: false
    default: "30m"
  litestreamL0Retention:
    description: "Durée pendant laquelle un fichier L0 déjà compacté en L1 est conservé dans la réplique avant suppression (défaut '3h' ; litestream livre '5m'). SEUL réglage de cette famille qui coûte des DONNÉES et pas de l'argent : une transaction atterrit d'abord en L0 et ne peut être balayée qu'une fois fusionnée en L1, donc une rétention trop courte supprime des écritures jamais recopiées ailleurs — sans que rien ne le signale, litestream continuant de répliquer normalement jusqu'au jour d'une restauration. Le service EXIGE donc au moins 2x l'intervalle du niveau 1 et refuse de démarrer en dessous (égal ne suffit pas : un fichier écrit juste après une compaction attend presque un intervalle entier, donc il y aurait course). Piège fréquent parce que les deux valeurs se règlent pour des raisons opposées : ralentir la compaction est ce qui économise, et la rétention est celle qu'on oublie de déplacer avec."
    mandatory: false
    default: "3h"
  litestreamLevelIntervals:
    description: "Intervalles de compaction des niveaux 1..N, séparés par des virgules et dans l'ordre croissant (défaut '30m,2h,6h' ; litestream livre '30s,5m,1h'). Mêmes propriétés que litestreamL0RetentionCheckInterval : minuteurs fixes par base, indépendants des écritures, un LIST par tic, sans effet sur la fenêtre de perte. Chaque niveau doit être strictement plus lent que le précédent, sinon le service refuse de démarrer."
    mandatory: false
    default: "30m,2h,6h"
  bootRestoreConcurrency:
    description: "Nombre d'apps restaurées en parallèle au démarrage de la VM (défaut 8, plage 1..64). Réglage de DISPONIBILITÉ, pas de coût : l'invariant « restaurer avant de servir » est intact — toutes les apps sont restaurées avant que le port ne soit ouvert — mais toute cette fenêtre est une panne totale, aucune org ne peut lire ni écrire jusqu'à sa fin, et elle croît linéairement avec le nombre d'apps vendues. Mesuré en prod le 24/08/2026 : 61 apps restaurées EN SÉRIE en 72 s, dont 54 écarts d'exactement 1 s et un seul de 14 s — une seule org porte 1320 Mo sur les 1352 Mo de la flotte. La fenêtre est donc à ~80 % des frais fixes par app (un sous-processus litestream + des allers-retours S3) payés sur des bases quasi vides : elle est bornée par la LATENCE, pas par le débit, et c'est exactement le cas où la concurrence rend un gain quasi linéaire. Chaque restauration étant un sous-processus, la valeur est bornée : la VM par défaut est une t4g.micro (916 Mo de RAM), ne pas monter ce nombre sans mesurer la mémoire."
    mandatory: false
    default: "8"
  writeStatsFlushMs:
    description: "Cadence de persistance des statistiques d'écriture par app, en millisecondes (défaut 300000, soit 5 min ; 0 désactive). Le chemin d'écriture ne touche QUE la mémoire — ce réglage est le prix à payer pour que cette mémoire survive au remplacement d'une instance. Seules les apps qui ont réellement écrit depuis le dernier envoi sont persistées, donc le coût suit l'activité réelle et non le nombre d'apps hébergées. Ces chiffres débloquent l'éviction des apps inactives, le tri chaud/froid et la limite de cadence anti-abus : ils ne se lisent pas depuis le seau de répliques, parce qu'un roulement de VM y remet l'horloge de toutes les bases à zéro (quatre fois le 24/08/2026)."
    mandatory: false
    default: "300000"
  evictionIdleDays:
    description: "Nombre de jours sans ÉCRITURE au bout desquels une app sort de la configuration litestream (défaut 0, c'est-à-dire DÉSACTIVÉ). L'app reste servie : son fichier reste sur le disque, les lectures continuent sans le moindre réveil, et la première instruction qui la touche la remet sous réplication AVANT de s'exécuter (ensureServed, le même verrou que pour une app jamais écrite). Ce qu'on récupère est la ressource rare : un jeu de minuteurs par base, un LIST du préfixe de réplique à chaque tic, ~1 fil système et ~0,46 Mo de mémoire — et ce sont les FILS qui plafonnent le nombre d'apps qu'une VM peut tenir (~10 800 mesurés, recommandation 5 000), donc une app inerte pèse sur toutes les autres orgs. Le seuil n'est pas qu'un réglage économique, c'est la GARANTIE DE VIDANGE : la réplication tourne avec un intervalle de ~1 s, donc une app qui n'a pas changé depuis des jours ne peut avoir aucune écriture en attente. Le défaut est 0 parce que cette garantie ne doit jamais être déduite : un opérateur pose le chiffre, ou rien n'est évincé. Une app que le compteur d'écritures n'a JAMAIS vue changer n'est jamais évincée — l'absence de preuve n'est pas une preuve d'inactivité, et comme l'historique du compteur commence à son déploiement, rien ne peut être évincé avant que l'inactivité réelle n'ait été observée pendant tout le seuil."
    mandatory: false
    default: "0"
  evictionSweepMs:
    description: "Cadence du balayage d'éviction, en millisecondes (défaut 3600000, soit 1 h). Rien n'y est urgent : ce qu'il récupère s'accumule sur des jours. Un balayage qui n'évince rien n'écrit PAS la configuration — un redémarrage de litestream suspend ~1 s la réplication de toutes les autres bases (un seul processus), donc un balayage bavard taxerait la flotte entière pour rien."
    mandatory: false
    default: "3600000"
  memoryHeadroomBytes:
    description: "Seuil d'alerte sur la mémoire disponible de la VM des bases, en octets (défaut 157286400, soit 150 Mo). C'est le plafond RÉEL du nombre d'apps qu'une instance peut tenir : litestream coûte environ 0,27 Mo de mémoire par base au-delà d'un socle fixe de ~65 Mo (mesuré de 20 à 1000 bases le 24/08/2026 avec scripts/loadtest.mjs ; la première lecture, 56,9 Mo divisés par 61, donnait « 0,93 Mo par base » et surestimait le coût marginal d'un facteur 3,4 — l'essentiel de ce total est un socle payé UNE fois) et l'instance par défaut n'a que 916 Mo — le mur est la mémoire, et il arrive bien avant n'importe quelle facture. Avant cette version, ce chiffre ne s'obtenait qu'en ouvrant une session SSM et en tapant `ps` à la main, autant dire jamais. L'alarme ne se déclenche PAS sur données manquantes, contrairement à ses voisines : une absence ici veut dire que le battement s'est arrêté, et l'alarme de battement le dit déjà — deux alertes pour un seul incident, c'est du bruit. Monter le seuil si l'instance est plus grosse."
    mandatory: false
    default: "157286400"
  amiId:
    description: "AMI of the database VM. Pinned by default to a specific AL2023 arm64 image of eu-west-1, so that an ordinary deploy NEVER replaces the instance (a replacement = ~60s with no Data API for every org). Bump the pin — in lib/hereya-aws-sqlite-data-stack.ts — or pass an id here to move the OS deliberately. 'latest' restores auto-resolution of the newest AL2023 arm64 image at every deploy (and with it the surprise replacement); outside eu-west-1, 'latest' or a region-local id is required."
    mandatory: false
