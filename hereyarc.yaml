name: dilaya/aws-sqlite-data
version: 0.1.19
description: "Durable SQLite storage for Dilaya: S3-replicated (Litestream) per-app SQLite files served by an HTTP Data API on a self-healing EC2 Spot singleton, fronted by an IAM-authorized API Gateway."
visibility: private
iac: cdk
infra: aws
parameters:
  capabilityEnforce:
    description: "When 'true', the Data API REQUIRES a valid x-dilaya-capability token on every data route (missing or invalid -> 403 CAPABILITY_DENIED). 'false' (default) = warn mode: the token is validated when present but a request without one is allowed (logging cap_missing). Flip to 'true' once every caller (connector + per-app Lambdas) mints tokens."
    mandatory: false
    default: "false"
  telegramBotTokenParam:
    description: "Nom du paramètre SSM portant le jeton du bot Telegram qui relaie les alarmes (heartbeat mort / ASG à zéro instance) — jamais le jeton lui-même. Peut pointer sur la fiche de credentials du connecteur ({\"bot_token\":…,\"secret_token\":…}) : le relais en extrait bot_token. Vide (défaut) -> aucune Lambda de relais n'est créée et le topic d'alarme reste sans abonné. DOIT être fourni avec telegramChatId."
    mandatory: false
    default: ""
  telegramChatId:
    description: "Chat id Telegram prévenu quand une alarme bascule (et quand elle se rétablit). DOIT être fourni avec telegramBotTokenParam — les deux conditionnent la création du relais."
    mandatory: false
    default: ""
  litestreamL0RetentionCheckInterval:
    description: "Cadence du balayage de rétention L0 (défaut '30m' ; litestream livre '15s'). Litestream lance ce balayage comme un minuteur FIXE par base, qu'elle ait été écrite ou non, et chaque tic LISTe la réplique S3 : c'est le premier poste de la facture de requêtes S3 (mesure du 24/08 : 16,5 M de ListBucket = 82,60 $ sur 24 jours, contre 0,25 $ de PutObject). NE TOUCHE PAS à la fenêtre de perte, qui est portée par litestreamSyncIntervalMs seul — ralentir ce balayage ne coûte qu'une restauration un peu plus lente."
    mandatory: false
    default: "30m"
  litestreamL0Retention:
    description: "Durée pendant laquelle un fichier L0 déjà compacté en L1 est conservé dans la réplique avant suppression (défaut '3h' ; litestream livre '5m'). SEUL réglage de cette famille qui coûte des DONNÉES et pas de l'argent : une transaction atterrit d'abord en L0 et ne peut être balayée qu'une fois fusionnée en L1, donc une rétention trop courte supprime des écritures jamais recopiées ailleurs — sans que rien ne le signale, litestream continuant de répliquer normalement jusqu'au jour d'une restauration. Le service EXIGE donc au moins 2x l'intervalle du niveau 1 et refuse de démarrer en dessous (égal ne suffit pas : un fichier écrit juste après une compaction attend presque un intervalle entier, donc il y aurait course). Piège fréquent parce que les deux valeurs se règlent pour des raisons opposées : ralentir la compaction est ce qui économise, et la rétention est celle qu'on oublie de déplacer avec."
    mandatory: false
    default: "3h"
  litestreamLevelIntervals:
    description: "Intervalles de compaction des niveaux 1..N, séparés par des virgules et dans l'ordre croissant (défaut '30m,2h,6h' ; litestream livre '30s,5m,1h'). Mêmes propriétés que litestreamL0RetentionCheckInterval : minuteurs fixes par base, indépendants des écritures, un LIST par tic, sans effet sur la fenêtre de perte. Chaque niveau doit être strictement plus lent que le précédent, sinon le service refuse de démarrer."
    mandatory: false
    default: "30m,2h,6h"
  amiId:
    description: "AMI of the database VM. Pinned by default to a specific AL2023 arm64 image of eu-west-1, so that an ordinary deploy NEVER replaces the instance (a replacement = ~60s with no Data API for every org). Bump the pin — in lib/hereya-aws-sqlite-data-stack.ts — or pass an id here to move the OS deliberately. 'latest' restores auto-resolution of the newest AL2023 arm64 image at every deploy (and with it the surprise replacement); outside eu-west-1, 'latest' or a region-local id is required."
    mandatory: false
